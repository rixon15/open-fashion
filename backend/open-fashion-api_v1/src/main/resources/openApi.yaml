openapi: 3.0.3
info:
  title: Open Fashion E-commerce API
  description: >
    API definition for a fashion e-commerce platform.
    Features: Product catalog, Variant selection, Shopping Cart management, Order processing, and Admin management.
  version: 1.0.0
  contact:
    name: API Support
    email: support@fashionstore.com

servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server

# Global Security Scheme (JWT)
security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentication and Registration
  - name: Products
    description: Product catalog and management
  - name: Categories
    description: Category hierarchy and management
  - name: Attributes
    description: Product attributes (Colors, Sizes)
  - name: Cart
    description: Shopping cart management
  - name: Orders
    description: Order processing and history
  - name: Account
    description: User profile and address management

paths:
  # ==========================
  # AUTHENTICATION
  # ==========================
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      description: >
        Validates email and password. Returns a JWT access token and a refresh token.
        The access token must be included in the 'Authorization' header for subsequent requests.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: >
        Creates a new customer account. The user is enabled by default. 
        Returns the authentication tokens immediately so the user is logged in upon registration.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email already in use

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      description: >
        Invalidates the user's refresh token in the database. 
        This prevents the generation of new access tokens, effectively logging the user out.
      operationId: logoutUser
      responses:
        '204':
          description: Logout successful
        '401':
          description: Unauthorized (Token invalid or missing)

  # ==========================
  # PRODUCTS
  # ==========================
  /products:
    get:
      tags: [Products]
      summary: List all products
      description: >
        Retrieves a paginated list of active products. 
        Can be filtered by category ID. Publicly accessible.
      operationId: getProducts
      security: []
      parameters:
        - name: page
          in: query
          description: Zero-based page index (default 0)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Number of records per page (default 20)
          schema:
            type: integer
            default: 20
        - name: categoryId
          in: query
          description: Filter products by a specific Category ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
    post:
      tags: [Products]
      summary: Create a new product (Admin)
      description: >
        Creates a new base product with its description and price. 
        **Requires Role: ADMIN**
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '403':
          description: Forbidden (Admin only)

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product details
      description: >
        Retrieves detailed information about a specific product, including all available 
        variant combinations (Size/Color) and images. Publicly accessible.
      operationId: getProductById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the product
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          description: Product not found
    put:
      tags: [Products]
      summary: Update a product (Admin)
      description: >
        Updates basic product details like name, description, brand, or base price.
        **Requires Role: ADMIN**
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '403':
          description: Forbidden
        '404':
          description: Product not found
    delete:
      tags: [Products]
      summary: Delete a product (Admin)
      description: >
        Soft-deletes the product (marks as inactive) so it no longer appears in the catalog, 
        but existing orders referencing it remain valid.
        **Requires Role: ADMIN**
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Product deleted successfully
        '403':
          description: Forbidden

  # ==========================
  # CATEGORIES
  # ==========================
  /categories:
    get:
      tags: [Categories]
      summary: Get category tree
      description: >
        Retrieves a flat list of all categories. The frontend is responsible for 
        constructing the tree using `parentId`. Publicly accessible.
      operationId: getCategories
      security: []
      responses:
        '200':
          description: List of all categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Create category (Admin)
      description: >
        Creates a new product category. Can be a top-level category or a child of an existing one.
        **Requires Role: ADMIN**
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWriteRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          description: Forbidden

  /categories/{id}:
    put:
      tags: [Categories]
      summary: Update category (Admin)
      description: >
        Renames a category or moves it to a different parent category.
        **Requires Role: ADMIN**
      operationId: updateCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWriteRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          description: Forbidden
    delete:
      tags: [Categories]
      summary: Delete category (Admin)
      description: >
        Deletes a category. This operation may fail if the category contains active products.
        **Requires Role: ADMIN**
      operationId: deleteCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Category deleted
        '403':
          description: Forbidden
        '409':
          description: Conflict (Category is not empty)

  # ==========================
  # ATTRIBUTES (COLORS/SIZES)
  # ==========================
  /colors:
    get:
      tags: [Attributes]
      summary: List all colors
      description: Retrieves the global list of available colors (dictionary). Publicly accessible.
      operationId: getColors
      security: []
      responses:
        '200':
          description: List of colors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Color'
    post:
      tags: [Attributes]
      summary: Add new color (Admin)
      description: >
        Adds a new color to the global dictionary.
        **Requires Role: ADMIN**
      operationId: createColor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColorWriteRequest'
      responses:
        '201':
          description: Color created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Color'
        '403':
          description: Forbidden

  /colors/{id}:
    delete:
      tags: [Attributes]
      summary: Delete color (Admin)
      description: >
        Removes a color from the dictionary. Should check for usage in existing products before deletion.
        **Requires Role: ADMIN**
      operationId: deleteColor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Color deleted
        '403':
          description: Forbidden

  /sizes:
    get:
      tags: [Attributes]
      summary: List all sizes
      description: Retrieves the global list of available sizes (S, M, L, XL, etc.). Publicly accessible.
      operationId: getSizes
      security: []
      responses:
        '200':
          description: List of sizes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Size'
    post:
      tags: [Attributes]
      summary: Add new size (Admin)
      description: >
        Adds a new size to the global dictionary.
        **Requires Role: ADMIN**
      operationId: createSize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SizeWriteRequest'
      responses:
        '201':
          description: Size created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Size'
        '403':
          description: Forbidden

  /sizes/{id}:
    delete:
      tags: [Attributes]
      summary: Delete size (Admin)
      description: >
        Removes a size from the dictionary.
        **Requires Role: ADMIN**
      operationId: deleteSize
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Size deleted
        '403':
          description: Forbidden

  # ==========================
  # CART
  # ==========================
  /cart:
    get:
      tags: [Cart]
      summary: Get user cart
      description: >
        Retrieves the persistent shopping cart for the currently authenticated user.
        Calculates totals based on current product prices.
      operationId: getCart
      responses:
        '200':
          description: Current cart details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    post:
      tags: [Cart]
      summary: Add item to cart
      description: >
        Adds a specific product variant (Color/Size combination) to the user's cart.
        If the item exists, it increments the quantity.
      operationId: addItemToCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '200':
          description: Item added, returns updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /cart/items/{itemId}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      description: >
        Updates the quantity of a specific item in the cart. 
        Set quantity to 0 to remove the item (though DELETE is preferred for removal).
      operationId: updateCartItem
      parameters:
        - name: itemId
          in: path
          required: true
          description: The ID of the CartItem (not the Product ID)
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    delete:
      tags: [Cart]
      summary: Remove item from cart
      description: Removes a specific item line from the user's shopping cart.
      operationId: removeCartItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Item removed successfully

  # ==========================
  # ORDERS
  # ==========================
  /orders:
    post:
      tags: [Orders]
      summary: Place order
      description: >
        Converts the current user's cart into a confirmed Shop Order.
        Snapshots product prices at the moment of purchase, clears the cart, and deducts inventory.
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Cart is empty or Items out of stock
    get:
      tags: [Orders]
      summary: Get my order history
      description: Retrieves a list of all past orders placed by the authenticated user.
      operationId: getOrderHistory
      responses:
        '200':
          description: List of past orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
      description: >
        Retrieves full details of a specific order, including line items, shipping address, 
        and historical prices.
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found (or does not belong to user)
    put:
      tags: [Orders]
      summary: Update order status (Admin)
      description: >
        Allows an Admin to update the status of an order (e.g., PENDING -> SHIPPED) 
        or correct the shipping address.
        **Requires Role: ADMIN**
      operationId: updateOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '403':
          description: Forbidden (Admin only)
    delete:
      tags: [Orders]
      summary: Delete order (Admin)
      description: >
        Hard deletes an order record. Use with caution as this removes financial history. 
        Usually used for cancelling test orders or duplicates.
        **Requires Role: ADMIN**
      operationId: deleteOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Order deleted
        '403':
          description: Forbidden

  # ==========================
  # ACCOUNT
  # ==========================
  /account/addresses:
    get:
      tags: [Account]
      summary: Get saved addresses
      description: Retrieves all shipping/billing addresses saved by the user.
      operationId: getAddresses
      responses:
        '200':
          description: List of user addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      tags: [Account]
      summary: Add address
      description: Adds a new address to the user's profile.
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

  /account/addresses/{id}:
    put:
      tags: [Account]
      summary: Update an address
      description: >
        Updates an existing address for the authenticated user.
        Users can only update their own addresses.
      operationId: updateAddress
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the address to update
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '200':
          description: Address updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '403':
          description: Forbidden (Address belongs to another user)
        '404':
          description: Address not found
    delete:
      tags: [Account]
      summary: Delete an address
      description: >
        Removes an address from the user's profile.
        If the address is used in past orders, the backend should handle this gracefully (soft delete or decouple).
      operationId: deleteAddress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Address deleted successfully
        '403':
          description: Forbidden
        '404':
          description: Address not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- AUTH ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        expiresIn:
          type: integer

    # --- PRODUCTS ---
    ProductListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    ProductSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        brand:
          type: string
        price:
          type: number
          format: double
        thumbnailUrl:
          type: string

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          properties:
            description:
              type: string
            images:
              type: array
              items:
                $ref: '#/components/schemas/ProductImage'
            variants:
              type: array
              items:
                $ref: '#/components/schemas/ProductVariant'

    ProductImage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
        isPrimary:
          type: boolean

    ProductVariant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        color:
          $ref: '#/components/schemas/Color'
        size:
          $ref: '#/components/schemas/Size'
        stockQuantity:
          type: integer
        priceOverride:
          type: number
          format: double
          nullable: true

    ProductWriteRequest:
      type: object
      required: [name, description, brand, price]
      properties:
        name:
          type: string
        description:
          type: string
        brand:
          type: string
        price:
          type: number
          format: double
        categoryIds:
          type: array
          items:
            type: integer
            format: int64

    # --- CATEGORIES ---
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        parentId:
          type: integer
          format: int64

    CategoryWriteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        parentId:
          type: integer
          format: int64
          nullable: true

    # --- ATTRIBUTES ---
    Color:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        hexcode:
          type: string

    ColorWriteRequest:
      type: object
      required: [name, hexcode]
      properties:
        name:
          type: string
        hexcode:
          type: string

    Size:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    SizeWriteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    # --- CART ---
    AddToCartRequest:
      type: object
      required: [productVariantId, quantity]
      properties:
        productVariantId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        totalAmount:
          type: number
          format: double

    CartItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productName:
          type: string
        productVariantId:
          type: integer
          format: int64
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        subTotal:
          type: number
          format: double
        imageUrl:
          type: string

    # --- ORDERS ---
    PlaceOrderRequest:
      type: object
      required: [shippingAddressId]
      properties:
        shippingAddressId:
          type: integer
          format: int64

    OrderUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, PAID, SHIPPED, DELIVERED, CANCELLED]
        trackingNumber:
          type: string
        shippingAddress:
          $ref: '#/components/schemas/AddressRequest'

    OrderSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, PAID, SHIPPED, DELIVERED, CANCELLED]
        totalAmount:
          type: number
          format: double

    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          properties:
            shippingAddress:
              $ref: '#/components/schemas/Address'
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'

    OrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productVariantId:
          type: integer
          format: int64
        productName:
          type: string
        color:
          type: string
        size:
          type: string
        quantity:
          type: integer
        priceAtPurchase:
          type: number
          format: double

    # --- ADDRESS ---
    Address:
      type: object
      properties:
        id:
          type: integer
          format: int64
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string
        isDefault:
          type: boolean

    AddressRequest:
      type: object
      required: [addressLine1, city, postalCode, country]
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string
        isDefault:
          type: boolean